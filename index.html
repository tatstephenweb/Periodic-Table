<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodic Table Trainer</title>
<style>
:root{--bg:#f6f7f4;--surface:#ffffff;--ink:#1c2321;--mute:#5d6b66;--line:#d9dfdb;--accent:#0f6b5c;--ok:#1d8a4b;--bad:#c2410c;
--alkali:#f4c7b8;--alkaline:#f1dca6;--transition:#c9d9ee;--post:#c8e3d4;--metalloid:#d7cfe8;--nonmetal:#b9e2e6;--halogen:#f0c3d9;--noble:#e1d6f5;--lanth:#f5d6a8;--actin:#e9c0c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--surface:#18201d;--ink:#e7efeb;--mute:#97a6a0;--line:#2c3834;--accent:#4fd1b6;--ok:#4ade80;--bad:#fb923c;
--alkali:#6b3a2b;--alkaline:#675219;--transition:#2f4966;--post:#2c5a43;--metalloid:#4b3f6b;--nonmetal:#1f5a62;--halogen:#6b2f50;--noble:#503d7a;--lanth:#6b4a1c;--actin:#6b2f2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101513;--surface:#18201d;--ink:#e7efeb;--mute:#97a6a0;--line:#2c3834;--accent:#4fd1b6;--ok:#4ade80;--bad:#fb923c;
--alkali:#6b3a2b;--alkaline:#675219;--transition:#2f4966;--post:#2c5a43;--metalloid:#4b3f6b;--nonmetal:#1f5a62;--halogen:#6b2f50;--noble:#503d7a;--lanth:#6b4a1c;--actin:#6b2f2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;margin:4px 0 12px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button,.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;flex-wrap:wrap}
.bar b{font-family:Georgia,serif;font-size:1.15rem}
.score{color:var(--mute);font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(18,minmax(42px,1fr));gap:3px;min-width:780px}
.el{aspect-ratio:1;border:1px solid transparent;border-radius:6px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font:inherit;line-height:1.1}
.el small{font-size:.58rem;color:var(--mute);align-self:flex-start;padding-left:3px}
.el strong{font-size:1.05rem}
.el span{font-size:.5rem;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.el.ok{outline:3px solid var(--ok)}.el.bad{outline:3px solid var(--bad)}
.el.dim{opacity:.35}
.gap{grid-row:8}
.c-alkali{background:var(--alkali)}.c-alkaline{background:var(--alkaline)}.c-transition{background:var(--transition)}.c-post{background:var(--post)}.c-metalloid{background:var(--metalloid)}.c-nonmetal{background:var(--nonmetal)}.c-halogen{background:var(--halogen)}.c-noble{background:var(--noble)}.c-lanth{background:var(--lanth)}.c-actin{background:var(--actin)}
.detail{margin-top:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:84px}
.detail h2{margin:0 0 4px;font-family:Georgia,serif;font-size:1.3rem}
.detail p{margin:2px 0;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.opts button{padding:14px;font-size:1rem}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--surface))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,var(--surface))}
.big{display:flex;align-items:baseline;gap:14px;margin:6px 0}
.big strong{font-family:Georgia,serif;font-size:3.4rem;line-height:1}
.big span{color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.78rem;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Periodic table trainer</h1>
<div class="tabs" role="group" aria-label="Mode">
<button data-m="explore" aria-pressed="true">Explore</button>
<button data-m="find" aria-pressed="false">Find it</button>
<button data-m="quiz" aria-pressed="false">Quiz</button>
</div>

<div id="bar" class="bar"><b id="prompt">Tap any element to learn about it</b><span class="score" id="score"></span></div>

<div id="quizBox" class="hidden">
<div class="big"><strong id="qSym"></strong><span id="qNum"></span></div>
<div class="opts" id="opts"></div>
</div>

<div id="tableBox" class="wrap"><div class="grid" id="grid"></div></div>
<div class="detail" id="detail"><p>Pick an element to see its number, group and period.</p></div>
<div class="legend" id="legend"></div>
</main>

<script>
const RAW="H Hydrogen,He Helium,Li Lithium,Be Beryllium,B Boron,C Carbon,N Nitrogen,O Oxygen,F Fluorine,Ne Neon,Na Sodium,Mg Magnesium,Al Aluminium,Si Silicon,P Phosphorus,S Sulfur,Cl Chlorine,Ar Argon,K Potassium,Ca Calcium,Sc Scandium,Ti Titanium,V Vanadium,Cr Chromium,Mn Manganese,Fe Iron,Co Cobalt,Ni Nickel,Cu Copper,Zn Zinc,Ga Gallium,Ge Germanium,As Arsenic,Se Selenium,Br Bromine,Kr Krypton,Rb Rubidium,Sr Strontium,Y Yttrium,Zr Zirconium,Nb Niobium,Mo Molybdenum,Tc Technetium,Ru Ruthenium,Rh Rhodium,Pd Palladium,Ag Silver,Cd Cadmium,In Indium,Sn Tin,Sb Antimony,Te Tellurium,I Iodine,Xe Xenon,Cs Caesium,Ba Barium,La Lanthanum,Ce Cerium,Pr Praseodymium,Nd Neodymium,Pm Promethium,Sm Samarium,Eu Europium,Gd Gadolinium,Tb Terbium,Dy Dysprosium,Ho Holmium,Er Erbium,Tm Thulium,Yb Ytterbium,Lu Lutetium,Hf Hafnium,Ta Tantalum,W Tungsten,Re Rhenium,Os Osmium,Ir Iridium,Pt Platinum,Au Gold,Hg Mercury,Tl Thallium,Pb Lead,Bi Bismuth,Po Polonium,At Astatine,Rn Radon,Fr Francium,Ra Radium,Ac Actinium,Th Thorium,Pa Protactinium,U Uranium,Np Neptunium,Pu Plutonium,Am Americium,Cm Curium,Bk Berkelium,Cf Californium,Es Einsteinium,Fm Fermium,Md Mendelevium,No Nobelium,Lr Lawrencium,Rf Rutherfordium,Db Dubnium,Sg Seaborgium,Bh Bohrium,Hs Hassium,Mt Meitnerium,Ds Darmstadtium,Rg Roentgenium,Cn Copernicium,Nh Nihonium,Fl Flerovium,Mc Moscovium,Lv Livermorium,Ts Tennessine,Og Oganesson";
const CATS={alkali:"Alkali metal",alkaline:"Alkaline earth metal",transition:"Transition metal",post:"Post-transition metal",metalloid:"Metalloid",nonmetal:"Reactive nonmetal",halogen:"Halogen",noble:"Noble gas",lanth:"Lanthanide",actin:"Actinide"};
const inR=(z,a,b)=>z>=a&&z<=b;
function cat(z){
 if([3,11,19,37,55,87].includes(z))return"alkali";
 if([4,12,20,38,56,88].includes(z))return"alkaline";
 if([9,17,35,53,85,117].includes(z))return"halogen";
 if([2,10,18,36,54,86,118].includes(z))return"noble";
 if(inR(z,57,71))return"lanth";if(inR(z,89,103))return"actin";
 if([5,14,32,33,51,52].includes(z))return"metalloid";
 if([1,6,7,8,15,16,34].includes(z))return"nonmetal";
 if([13,31,49,50,81,82,83,84,113,114,115,116].includes(z))return"post";
 return"transition";
}
function pos(z){ // returns [row, col, period, group]
 if(z==1)return[1,1,1,1];if(z==2)return[1,18,1,18];
 if(inR(z,3,4))return[2,z-2,2,z-2];if(inR(z,5,10))return[2,z+8,2,z+8];
 if(inR(z,11,12))return[3,z-10,3,z-10];if(inR(z,13,18))return[3,z,3,z];
 if(inR(z,19,36))return[4,z-18,4,z-18];if(inR(z,37,54))return[5,z-36,5,z-36];
 if(z==55||z==56)return[6,z-54,6,z-54];
 if(inR(z,57,71))return[9,z-54,6,null];
 if(inR(z,72,86))return[6,z-68,6,z-68];
 if(z==87||z==88)return[7,z-86,7,z-86];
 if(inR(z,89,103))return[10,z-86,7,null];
 return[7,z-100,7,z-100];
}
const EL=RAW.split(",").map((s,i)=>{const[sym,name]=s.split(" ");const z=i+1,p=pos(z);return{z,sym,name,c:cat(z),row:p[0],col:p[1],period:p[2],group:p[3]}});

const $=id=>document.getElementById(id);
const grid=$("grid");
let mode="explore",target=null,stats={right:0,tries:0},locked=false,cells={};

function build(){
 grid.innerHTML="";
 EL.forEach(e=>{
  const b=document.createElement("button");
  b.className="el c-"+e.c;b.style.gridRow=e.row;b.style.gridColumn=e.col;
  b.dataset.z=e.z;b.setAttribute("aria-label",e.name);
  b.innerHTML="<small>"+e.z+"</small><strong>"+e.sym+"</strong><span>"+e.name+"</span>";
  b.addEventListener("click",()=>onCell(e));
  grid.appendChild(b);cells[e.z]=b;
 });
 const lg=$("legend");
 lg.innerHTML=Object.keys(CATS).map(k=>'<span><i class="c-'+k+'"></i>'+CATS[k]+'</span>').join("");
}
function showLabels(on){grid.querySelectorAll("span").forEach(s=>s.style.display=on?"":"none")}
function clearMarks(){Object.values(cells).forEach(c=>c.classList.remove("ok","bad","dim"))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function updScore(){$("score").textContent=mode==="explore"?"":stats.right+" / "+stats.tries+" correct"}

function setMode(m){
 mode=m;stats={right:0,tries:0};locked=false;clearMarks();
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
 $("quizBox").classList.toggle("hidden",m!=="quiz");
 $("tableBox").classList.toggle("hidden",m==="quiz");
 $("legend").classList.toggle("hidden",m==="quiz");
 $("detail").classList.toggle("hidden",m!=="explore");
 showLabels(m==="explore");
 updScore();
 if(m==="explore")$("prompt").textContent="Tap any element to learn about it";
 else next();
}
function next(){
 locked=false;clearMarks();target=rand(EL);
 if(mode==="find"){$("prompt").textContent="Find "+target.name}
 if(mode==="quiz"){
  $("prompt").textContent="What is the name of this element?";
  $("qSym").textContent=target.sym;$("qNum").textContent="Atomic number "+target.z;
  const wrong=[];while(wrong.length<3){const w=rand(EL);if(w!==target&&!wrong.includes(w))wrong.push(w)}
  const all=[target,...wrong].sort(()=>Math.random()-.5);
  $("opts").innerHTML="";
  all.forEach(e=>{const b=document.createElement("button");b.className="btn";b.textContent=e.name;
   b.onclick=()=>answerQuiz(e,b);$("opts").appendChild(b)});
 }
}
function answerQuiz(e,btn){
 if(locked)return;locked=true;stats.tries++;
 const ok=e===target;if(ok)stats.right++;
 btn.classList.add(ok?"ok":"bad");
 if(!ok)[...$("opts").children].forEach(b=>{if(b.textContent===target.name)b.classList.add("ok")});
 updScore();setTimeout(next,ok?600:1500);
}
function onCell(e){
 if(mode==="explore"){
  clearMarks();cells[e.z].classList.add("ok");
  $("detail").innerHTML="<h2>"+e.name+" ("+e.sym+")</h2><p>Atomic number "+e.z+"</p><p>"+CATS[e.c]+"</p><p>Period "+e.period+(e.group?", group "+e.group:", f-block")+"</p>";
 }else if(mode==="find"){
  if(locked)return;locked=true;stats.tries++;
  if(e===target){stats.right++;cells[e.z].classList.add("ok")}
  else{cells[e.z].classList.add("bad");cells[target.z].classList.add("ok")}
  updScore();setTimeout(next,e===target?600:1500);
 }
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.m)));
build();setMode("explore");
</script>
</body>
</html>
